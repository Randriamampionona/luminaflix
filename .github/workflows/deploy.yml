name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SSH_PORT: "21098" # Namecheap shared hosting SSH port
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Write build-time env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env.production

      - name: Install
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build
        run: yarn build

      - name: Assemble standalone bundle
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          rm -f .next/standalone/.env .next/standalone/.env.*

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.NC_SSH_KEY }}
          HOST: ${{ secrets.NC_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$HOST" >> ~/.ssh/known_hosts

      - name: Upload and switch release
        env:
          HOST: ${{ secrets.NC_HOST }}
          USER: ${{ secrets.NC_USER }}
        run: |
          SSH="ssh -p $SSH_PORT"
          $SSH "$USER@$HOST" 'mkdir -p ~/luminaflix ~/public_html/_next/static'

          # 1. App: upload to a fresh folder, hard-linking unchanged files from the live release
          rsync -az --delete --link-dest=../standalone -e "$SSH" \
            .next/standalone/ "$USER@$HOST:luminaflix/standalone_new/"
          rsync -az -e "$SSH" deploy/namecheap/app.js "$USER@$HOST:luminaflix/app.js"

          # 2. Hashed JS/CSS chunks: also copied into public_html so Apache serves them
          #    directly (fewer requests hitting the Node process on the Stellar limits).
          #    No --delete: open tabs on the previous version still find their chunks.
          rsync -az -e "$SSH" .next/static/ "$USER@$HOST:public_html/_next/static/"
          $SSH "$USER@$HOST" 'printf "%s\n" "<IfModule mod_headers.c>" "Header set Cache-Control \"public, max-age=31536000, immutable\"" "</IfModule>" > ~/public_html/_next/.htaccess'

          # 3. Swap releases, then ask Passenger to restart the app
          $SSH "$USER@$HOST" '
            set -e
            cd ~/luminaflix
            rm -rf standalone_old
            if [ -d standalone ]; then mv standalone standalone_old; fi
            mv standalone_new standalone
            mkdir -p tmp && touch tmp/restart.txt
          '
